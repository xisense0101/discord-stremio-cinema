version: '3.8'

services:
  stream-worker:
    image: discord-stremio-worker:latest
    container_name: stremio_stream_worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3.50'
          memory: 3072M
        reservations:
          cpus: '1.00'
          memory: 1536M
    mem_limit: 3072m
    mem_reservation: 1536m
    cpus: 3.5
    ipc: host
    tmpfs:
      - /tmp:size=1024M,mode=1777
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048
      - WORKER_PORT=4001
      - PORT=4001
      - PUPPETEER_HEADLESS=true
    volumes:
      - /opt/streamer/.env:/app/.env
      - /opt/streamer/data:/app/data
